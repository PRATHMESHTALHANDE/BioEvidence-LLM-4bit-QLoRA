[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioevidence-llm"
version = "0.1.0"
description = "Biomedical Evidence-Grounded Language Model System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BioEvidence-LLM Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "bitsandbytes>=0.43.0",
    "evaluate>=0.4.2",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "pydantic>=2.8.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mlflow>=2.15.0",
    "gradio>=4.40.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "W291", "W293"]
